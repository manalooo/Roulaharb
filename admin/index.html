<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roula Harb Admin</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="admin-shell">
    <section id="login-card" class="card">
      <h1>Admin Login</h1>
      <p class="muted">Enter the shared password to add products.</p>
      <form id="login-form">
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
      </form>
      <p id="login-msg" class="msg"></p>
    </section>

    <section id="app-card" class="card hidden">
      <div class="row between">
        <h1>Add Product</h1>
        <button id="logout-btn" class="btn-secondary" type="button">Log out</button>
      </div>
      <p class="muted">Uses the same fields as your inventory CSV, with ID generated automatically.</p>

      <form id="product-form">
        <div class="grid two">
          <label>
            Name
            <input id="name" required />
          </label>
          <label>
            Category
            <select id="category" required>
              <option value="scarves">scarves</option>
              <option value="bags">bags</option>
              <option value="wearables">wearables</option>
              <option value="pillows">pillows</option>
              <option value="paintings">paintings</option>
            </select>
          </label>
          <label>
            Auto ID
            <input id="id-preview" disabled />
          </label>
          <label>
            Status
            <select id="status" required>
              <option value="available">available</option>
              <option value="sold">sold</option>
            </select>
          </label>
          <label>
            Subcollection
            <input id="subcollection" />
          </label>
          <label>
            Era
            <input id="era" />
          </label>
          <label>
            Price
            <input id="price" placeholder="e.g. 380 or ENTER PRICE HERE" />
          </label>
          <label>
            Material
            <input id="material" placeholder="e.g. cotton" />
          </label>
        </div>

        <div class="grid two">
          <label>
            Main image (required)
            <input id="main-image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required />
          </label>
          <label>
            Hover image (optional)
            <input id="hover-image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
          </label>
        </div>

        <div class="grid two">
          <div>
            <p class="preview-title">Main preview</p>
            <img id="main-preview" class="preview" alt="" />
          </div>
          <div>
            <p class="preview-title">Hover preview</p>
            <img id="hover-preview" class="preview" alt="" />
          </div>
        </div>

        <button id="submit-btn" type="submit">Save and Publish</button>
      </form>
      <p id="form-msg" class="msg"></p>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
